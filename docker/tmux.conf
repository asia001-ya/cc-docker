# =============================================================================
# tdc 全局 tmux 配置：tmux 只负责"会话持久化 / 断线重连"，对用户尽量透明
#   - 桌面端已提供 Tab 与分屏，因此禁用前缀键，避免与 Ctrl+B（Claude Code 转后台）冲突
#   - 关闭状态栏，终端画布 100% 留给应用内容
# =============================================================================

# 禁用前缀键：所有按键原样交给 shell / Claude Code
set -g prefix None
unbind C-b

# 隐藏状态栏
set -g status off

# 真彩透传：外层终端（xterm.js）声明 xterm-256color，并具备 RGB 能力
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# 交互响应：Esc 不延迟（Claude Code / vim 依赖 Esc），保留焦点事件
set -sg escape-time 0
set -g focus-events on

# 历史与滚动：tmux 管理回滚缓冲，鼠标滚轮进入 copy-mode 浏览历史
set -g history-limit 50000
set -g mouse on

# 剪贴板：copy-mode 选中内容通过 OSC 52 发给外层终端（桌面端已启用 clipboard 插件）
set -g set-clipboard on
# 允许程序输出的 OSC 序列（超链接、通知等）穿透 tmux
set -g allow-passthrough on

# 多客户端附着时按当前活动客户端尺寸调整，避免出现点状填充区域
setw -g aggressive-resize on

# 登录 shell，保证 PATH / 环境变量与 docker exec bash -l 一致
set -g default-shell /bin/bash
set -g default-command "bash -l"

# 会话结束后不保留死窗格
setw -g remain-on-exit off
